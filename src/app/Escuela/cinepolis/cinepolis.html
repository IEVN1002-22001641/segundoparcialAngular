<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
 
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Cinepolis
  </h1>

  <h2>Entradas</h2>
  <br>
  <form [formGroup]="formulario">
 
    <!-- Nombre -->
    <div class="mb-5">
 
      <label
        for="nombre"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>
 
      <input
        type="text"
        id="nombre"
        name="nombre"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre(s) y Apellidos"
      >
    </div>

        <!-- Cantidad Compradores -->
    <div class="mb-5">
 
      <label
        for="cc"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Cantidad Compradores
      </label>
 
      <input
        type="number"
        id="cc"
        name="cc"
        formControlName="cc"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Cantidad de compradores"
      >
    </div>

        <!-- Tarjeta Cineco -->
    <div class="mb-5">
      <div class="flex items-center">

        <label
          class="ms-2 text-sm font-medium text-gray-900"
        >
          ¿Cuenta con tarjeta Cineco?
        </label>
 
        <input
          type="radio"
          id="cinecoSi"
          name="cineco"
          formControlName="cineco"
          [value]="true"
          required
          class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300
                 rounded focus:ring-blue-500 focus:ring-2"
        >Sí

        <input
          type="radio"
          id="cinecoNo"
          name="cineco"
          formControlName="cineco"
          [value]="false"
          required
          class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300
                 rounded focus:ring-blue-500 focus:ring-2"
        >No
 
      </div>
    </div>

        <!-- Cantidad Boletos -->
    <div class="mb-5">
 
      <label
        for="cb"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Cantidad Boletos
      </label>
 
      <input
        type="number"
        id="cb"
        name="cb"
        formControlName="cb"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="¿Cuántos Boletos?"
      >
    </div>

    @if (mensajeError) {
      <div class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 border border-red-300" role="alert">
        <span class="font-medium">Atención:</span> {{ mensajeError }}
      </div>
    }

    <hr>
    <h2>Salidas</h2>
    <br>
          <p class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        Valor a pagar: {{totalPagar}}
      </p>
  </form>


  <h1>Acciones</h1>
  <h2>Nombre: {{nuevoCinepolis.nombre}}</h2>
  <h2>Cantidad Boletos: {{nuevoCinepolis.cb}}</h2> 
  <button (click)="preocesoPago()" class="btn">Procesar</button>
  <button [routerLink]="['../ver-registros']" class="btn">Ver Registros</button>
  <button ></button>
  
 
</div>
