<div class="bg-white border border-gray-100 rounded-2xl shadow-xl max-w-lg mx-auto p-8 my-6">
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold tracking-tight text-slate-900">Editar Maestro</h2>
    <p class="text-sm text-slate-500 mt-1">Modifica los datos necesarios del registro</p>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="w-full">
    <div class="relative z-0 w-full mb-6 group">
      <input
        type="number"
        name="idmaestro"
        id="idmaestro"
        readonly
        class="block py-2.5 px-0 w-full text-sm text-slate-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-950 peer cursor-not-allowed opacity-75"
        placeholder=" "
        formControlName="idmaestro"
      />
      <label
        for="idmaestro"
        class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-950 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
      >ID Maestro (No editable)</label>
    </div>

    <div class="relative z-0 w-full mb-6 group">
      <input
        type="text"
        name="nombre"
        id="nombre"
        class="block py-2.5 px-0 w-full text-sm text-slate-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-950 peer"
        placeholder=" "
        formControlName="nombre"
      />
      <label
        for="nombre"
        class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-950 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
      >Nombre</label>
    </div>

    <div class="relative z-0 w-full mb-6 group">
      <input
        type="text"
        name="apaterno"
        id="apaterno"
        class="block py-2.5 px-0 w-full text-sm text-slate-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-950 peer"
        placeholder=" "
        formControlName="apaterno"
      />
      <label
        for="apaterno"
        class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-950 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
      >Apellido Paterno</label>
    </div>

    <div class="grid md:grid-cols-2 md:gap-6">
      <div class="relative z-0 w-full mb-6 group">
        <input
          type="text"
          name="amaterno"
          id="amaterno"
          class="block py-2.5 px-0 w-full text-sm text-slate-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-950 peer"
          placeholder=" "
          formControlName="amaterno"
        />
        <label
          for="amaterno"
          class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-950 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
        >Apellido Materno</label>
      </div>

      <div class="relative z-0 w-full mb-6 group">
        <input
          type="email"
          name="correo"
          id="correo"
          class="block py-2.5 px-0 w-full text-sm text-slate-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-950 peer"
          placeholder=" "
          formControlName="correo"
        />
        <label
          for="correo"
          class="peer-focus:font-medium absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-950 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
        >Correo electrónico</label>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 mt-8 pt-4 border-t border-gray-100">
      <button
        type="button"
        class="text-slate-700 bg-white border border-gray-300 hover:bg-gray-50 focus:ring-4 focus:outline-none focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center transition-colors cursor-pointer"
        [routerLink]="['/utl/maestros']"
      >
        Cancelar
        <svg
          class="rtl:rotate-180 w-3.5 h-3.5 ms-2"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 14 10"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M1 5h12m0 0L9 1m4 4L9 9"
          />
        </svg>
      </button>

      <button
        type="submit"
        class="text-white bg-blue-950 hover:bg-blue-900 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center transition-colors shadow-sm cursor-pointer"
      >
        <svg
          class="w-3.5 h-3.5 me-2"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path d="M17.414 2.586a2 2 0 0 0-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 0 0 0-2.828ZM5 5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a1 1 0 1 0-2 0v6H5V7h6a1 1 0 1 0 0-2H5Z"/>
        </svg>
        Modificar
      </button>
    </div>
  </form>
</div>
